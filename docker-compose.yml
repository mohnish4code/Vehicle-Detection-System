services:
  backend:
    build: ./backend
    environment:
      VDS_SHEETS_SPREADSHEET_ID: ${SPREADSHEET_ID:-}
      VDS_SHEETS_SPREADSHEET_NAME: ${SPREADSHEET_NAME:-Vehicle_Tracking_System}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google/credentials.json
      VDS_API_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      # Put the service account key at ./secrets/credentials.json.
      # Without it the app still runs, it just can't log to Sheets.
      - ./secrets:/run/secrets/google:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
